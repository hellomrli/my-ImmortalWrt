# IPTV HTTP/HLS relay on x86_64. Lucky terminates both TCP connections locally,
# so BBR applies to its outgoing data. This does not tune a remote server's TCP
# congestion control, nor does it accelerate plain UDP multicast forwarding.
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# Autotuning ceilings, not per-connection allocations. 16 MiB receive covers
# about 134 ms at 1 Gbit/s; 8 MiB send easily covers multiple LAN HLS clients.
# Keep kernel initial sizes so idle sockets do not consume large buffers.
net.core.rmem_max=16777216
net.core.wmem_max=8388608
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 16384 8388608
net.core.netdev_max_backlog=8192
net.core.somaxconn=4096
net.ipv4.tcp_max_syn_backlog=4096
net.ipv4.tcp_mtu_probing=1

# Current device had only tens of tracked connections; retain 64K capacity,
# rather than importing the transparent-proxy profile's 256K entries.
net.netfilter.nf_conntrack_max=65536
net.netfilter.nf_conntrack_buckets=16384

# Keep ephemeral ports at the normal high range; the known 8080/8081/18811
# services are outside it. No blanket TCP timeouts, forced socket minima,
# oversized UDP queues, or global IPv6 / rp_filter changes are necessary.
net.ipv4.ip_local_port_range=32768 60999
