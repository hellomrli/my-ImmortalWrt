# Performance profile for this firmware.
#
# /etc/init.d/sysctl (START=11) applies this at boot, and /etc/init.d/perf-tune
# (START=99) re-applies it once nf_conntrack exists -- see that script for why.

# --- Congestion control ------------------------------------------------------
# On an ordinary router BBR would be pointless: forwarded traffic is governed by
# the endpoints' congestion control, not the router's.  Here it is not, because
# dae terminates the client's TCP locally and opens its own connection to the
# proxy server -- those outbound connections use this setting.  On lossy
# long-RTT international paths BBR sustains far more throughput than cubic,
# which collapses its window on every loss event.
#
# fq is BBR's companion qdisc (BBR relies on it for pacing).  It only applies to
# interfaces that have no explicit qdisc, so SQM/cake on the WAN is untouched.
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# --- Socket buffers ----------------------------------------------------------
# Raise the ceiling only.  Linux autotunes between min and max, so leaving the
# middle (default) values near stock keeps per-connection memory small while
# allowing high-bandwidth-delay-product paths to open up.  16 MiB covers roughly
# 600 Mbit/s at 200 ms RTT.
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 16384 16777216

# --- Queues ------------------------------------------------------------------
net.core.netdev_max_backlog=16384
net.core.somaxconn=8192

# --- TCP behaviour -----------------------------------------------------------
# Proxy connections go idle and then burst.  By default the kernel resets the
# congestion window after an idle period, which costs a slow-start ramp every
# time on a long-RTT link.
net.ipv4.tcp_slow_start_after_idle=0
# Proxied and tunnelled paths frequently black-hole the ICMP needed for path MTU
# discovery, which shows up as connections that establish but then stall.
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_fastopen=3

# --- Ephemeral ports ---------------------------------------------------------
# A proxy router opens far more outbound connections than a normal one, so widen
# the ephemeral range.  The widened range now covers this firmware's service
# ports, so reserve them: without this an ephemeral socket can occupy e.g. 50530
# before AdGuardHome binds it, and the service fails to start after a restart.
net.ipv4.ip_local_port_range=10000 65000
net.ipv4.ip_local_reserved_ports=2023,50080,50081,50530,50531

# --- Connection tracking -----------------------------------------------------
# Every proxied client connection costs two entries: client->router and
# router->proxy server.  Buckets are raised with max (roughly max/4) so the
# hash chains stay short; raising max alone would slow every lookup.
#
# These two keys only exist once nf_conntrack is loaded, which is why
# /etc/init.d/perf-tune re-applies this file late in boot.
net.netfilter.nf_conntrack_buckets=32768
net.netfilter.nf_conntrack_max=131072
