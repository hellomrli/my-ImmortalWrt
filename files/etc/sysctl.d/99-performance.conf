# Performance profile for this firmware.
#
# /etc/init.d/sysctl (START=11) applies this at boot, and /etc/init.d/perf-tune
# (START=99) re-applies it once nf_conntrack exists -- see that script for why.

# --- Congestion control ------------------------------------------------------
# On an ordinary router BBR would be pointless: forwarded traffic is governed by
# the endpoints' congestion control, not the router's.  Here it is not, because
# dae terminates the client's TCP locally and opens its own connection to the
# proxy server -- those outbound connections use this setting.  On lossy
# long-RTT international paths BBR sustains far more throughput than cubic,
# which collapses its window on every loss event.
#
# fq is BBR's companion qdisc (BBR relies on it for pacing).  It only applies to
# interfaces that have no explicit qdisc, so SQM/cake on the WAN is untouched.
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# --- Socket buffers ----------------------------------------------------------
# Sized from the bandwidth-delay product of this line (1000 Mbit/s down,
# 100 Mbit/s up), not by picking the largest number that fits.  A single flow
# needs BDP bytes of buffer to keep the pipe full:
#
#   down 1000 Mbit/s:   6 MiB @  50 ms   12 MiB @ 100 ms   30 MiB @ 250 ms
#   up    100 Mbit/s: 0.6 MiB @  50 ms  1.2 MiB @ 100 ms  3.0 MiB @ 250 ms
#
# So 32 MiB receive covers the worst realistic proxy RTT, and 16 MiB send is
# already 5x what a 100 Mbit/s uplink can use.
#
# Only the ceiling is raised.  The middle value is the per-connection starting
# size and is left at the kernel default: Linux autotunes upward on demand, so
# a high ceiling costs nothing until a flow actually needs it, while a high
# default would multiply across every open connection.
net.core.rmem_max=33554432
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 131072 33554432
net.ipv4.tcp_wmem=4096 16384 16777216

# --- Queues ------------------------------------------------------------------
# Deliberately NOT maximised.  netdev_max_backlog is a buffer: oversizing it
# does not add throughput, it just lets packets queue longer before the CPU
# drains them, which is bufferbloat by another name.  16384 absorbs a burst at
# 1 Gbit/s with room to spare; going higher would trade latency for nothing.
net.core.netdev_max_backlog=16384
net.core.somaxconn=8192
net.ipv4.tcp_max_syn_backlog=8192

# --- TCP behaviour -----------------------------------------------------------
# Proxy connections go idle and then burst.  By default the kernel resets the
# congestion window after an idle period, which costs a slow-start ramp every
# time on a long-RTT link.
net.ipv4.tcp_slow_start_after_idle=0
# Proxied and tunnelled paths frequently black-hole the ICMP needed for path MTU
# discovery, which shows up as connections that establish but then stall.
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_fastopen=3
# The proxy workload churns short-lived outbound connections (TLS/HTTP
# handshakes to proxy servers), and each one lingers in TIME_WAIT for
# tcp_fin_timeout.  Halving it frees ephemeral ports faster on top of the
# widened range above.
net.ipv4.tcp_fin_timeout=30
# Let small proxied requests (TLS handshakes, first HTTP bytes) leave
# immediately instead of waiting for a full congestion window of data.
net.ipv4.tcp_notsent_lowat=16384

# --- Ephemeral ports ---------------------------------------------------------
# A proxy router opens far more outbound connections than a normal one, so widen
# the ephemeral range.  The widened range now covers this firmware's service
# ports, so reserve them: without this an ephemeral socket can occupy e.g. 50530
# before AdGuardHome binds it, and the service fails to start after a restart.
net.ipv4.ip_local_port_range=10000 65000
net.ipv4.ip_local_reserved_ports=2023,50080,50081,50530,50531

# --- Connection tracking -----------------------------------------------------
# Every proxied client connection costs two entries: client->router and
# router->proxy server.  Buckets are raised with max (roughly max/4) so the
# hash chains stay short; raising max alone would slow every lookup.
#
# Cost at this size: entries are allocated on demand at ~300 B each, so 75 MiB
# only if the table ever actually fills; the bucket array is 512 KiB up front.
#
# These two keys only exist once nf_conntrack is loaded, which is why
# /etc/init.d/perf-tune re-applies this file late in boot.
net.netfilter.nf_conntrack_buckets=65536
net.netfilter.nf_conntrack_max=262144

# --- UDP ---------------------------------------------------------------------
# QUIC is a large share of modern traffic (Google, YouTube, many CDNs) and dae
# proxies it as UDP, so the per-socket UDP floor matters more here than on a
# plain router.
net.ipv4.udp_rmem_min=16384
net.ipv4.udp_wmem_min=16384

# --- Memory ------------------------------------------------------------------
# dae and the two AdGuardHome instances are memory-backed services; on the
# default swappiness of 60 anonymous pages are pushed to swap too eagerly,
# which stalls DNS lookups and proxy connections under memory pressure.  With
# no swap partition this is a no-op; with one it keeps hot pages resident.
vm.swappiness=10
