name: Update README Build Table

on:
  workflow_dispatch:
  # No `release:` trigger: releases here are created by GITHUB_TOKEN, and events
  # raised by that token do not start workflow runs (workflow_dispatch and
  # repository_dispatch are the only exceptions).  openwrt-builder.yml therefore
  # dispatches this workflow explicitly after publishing.
  schedule:
    - cron: 30 5 * * *

permissions:
  contents: write

concurrency:
  group: update-readme-build-table
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Release events run on refs/tags/<tag>; update README on main instead.
        ref: main
        fetch-depth: 0

    - name: Update README build table
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python3 .github/scripts/update-readme-build-table.py

    - name: Commit changes
      run: |
        if git diff --quiet README.md; then
          echo "README build table is already current."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "docs: update firmware build table"

        # Rebase-and-retry: a build job dispatches this workflow, so a push can
        # race with a concurrent commit on main.
        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          echo "push rejected (attempt ${attempt}/3); rebasing onto latest main"
          git pull --rebase origin main
        done
        exit 1
