name: Update Checker

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: 35 */6 * * *

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Generate check matrix
      id: matrix
      run: |
        python3 - <<'PY'
        import json
        import os

        with open(".github/targets.json", encoding="utf-8") as target_file:
            targets = json.load(target_file)["targets"]
        matrix = json.dumps(
            {
                "include": [
                    {"source": t["source"], "repo_url": t["repo_url"], "branch": t["branch"]}
                    for t in targets
                ]
            },
            separators=(",", ":"),
        )
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"matrix={matrix}\n")
        PY

  check:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      # 只监控 ImmortalWrt 上游分支（来自 .github/targets.json）。
      # Lucky / Watchdog / kenzok8 dae + daed + luci-app-daede 会在每次固件构建前
      # 直接从各自上游仓库拉取；Golang / AdGuardHome 使用 ImmortalWrt 官方 feeds。
      # 这里不把第三方仓库作为自动触发源，避免频繁变动导致无意义构建；
      # 任意一次固件构建都会重新拉取 kenzok8/openwrt-daede 默认分支的最新版本。

    steps:

    - name: Get Commit Hash
      id: getHash
      run: |
        mkdir -p .commitHash
        commit_hash="$(git ls-remote "${{ matrix.repo_url }}" "refs/heads/${{ matrix.branch }}" | awk '{print $1}')"
        [ -n "$commit_hash" ] || { echo "Failed to resolve ${{ matrix.repo_url }} branch ${{ matrix.branch }}"; exit 1; }
        echo "${{ matrix.source }}/${{ matrix.branch }}=$commit_hash" > ".commitHash/${{ matrix.source }}-${{ matrix.branch }}"
        echo "commitHash=$commit_hash" >> $GITHUB_OUTPUT

    # Look up only.  The marker is written by openwrt-builder.yml after a
    # release is actually published, so a failed build stays "not built" and
    # gets retried on the next check instead of waiting for a new upstream
    # commit that may be days away.
    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache/restore@v4
      with:
        path: .commitHash/${{ matrix.source }}-${{ matrix.branch }}
        key: commitHash_${{ matrix.source }}_${{ matrix.branch }}_${{ steps.getHash.outputs.commitHash }}
        lookup-only: true

    - name: Report new commit
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        cat ".commitHash/${{ matrix.source }}-${{ matrix.branch }}"

    - name: Trigger build
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ github.token }}
        event-type: openwrt-builder
        client-payload: '{"sources": "${{ matrix.source }}", "branches": "${{ matrix.branch }}"}'

  cleanup-runs:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
    - name: Delete workflow runs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run list --repo="${{ github.repository }}" --workflow="${{ github.workflow }}" --limit 100 --json databaseId,status --jq '.[] | select(.status != "in_progress") | .databaseId' > old-runs.txt
        tail -n +11 old-runs.txt | while read -r run_id; do
          [ -n "$run_id" ] && gh run delete --repo="${{ github.repository }}" "$run_id" || true
        done
