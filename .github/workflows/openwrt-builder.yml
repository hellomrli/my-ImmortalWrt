name: OpenWrt Builder

on:
  repository_dispatch:
    types: [openwrt-builder]
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to build (comma separated, JSON array, or "all")'
        required: false
        default: 'all'
        type: string
      branches:
        description: 'Branches to build (comma separated, JSON array, or "all")'
        required: false
        default: 'all'
        type: string

# Least privilege by default.  The build job compiles third-party package
# Makefiles, so only the jobs that actually publish get a write token.
permissions:
  contents: read

env:
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
    - name: Generate build matrix
      id: matrix
      shell: bash
      env:
        REQUESTED_SOURCES: ${{ github.event.client_payload.sources || github.event.inputs.sources || 'all' }}
        REQUESTED_BRANCHES: ${{ github.event.client_payload.branches || github.event.inputs.branches || 'all' }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys

        targets = [
            {
                "source": "immortalwrt",
                "branch": "master",
                "repo_url": "https://github.com/immortalwrt/immortalwrt",
                "config_file": "configs/immortalwrt.config",
                "diy_p1_sh": "diy-part1.sh",
                "diy_p2_sh": "diy-part2-daed.sh",
            },
            {
                "source": "immortalwrt",
                "branch": "openwrt-25.12",
                "repo_url": "https://github.com/immortalwrt/immortalwrt",
                "config_file": "configs/immortalwrt.config",
                "diy_p1_sh": "diy-part1.sh",
                "diy_p2_sh": "diy-part2-daed.sh",
            },
        ]

        def parse_selection(value):
            value = (value or "all").strip()
            if not value or value == "all":
                return None
            try:
                parsed = json.loads(value)
                if isinstance(parsed, str):
                    return {parsed}
                return {str(item).strip() for item in parsed if str(item).strip()}
            except json.JSONDecodeError:
                return {item.strip().strip('"').strip("'") for item in value.split(",") if item.strip()}

        sources = parse_selection(os.environ.get("REQUESTED_SOURCES"))
        branches = parse_selection(os.environ.get("REQUESTED_BRANCHES"))
        selected = [
            target for target in targets
            if (sources is None or target["source"] in sources)
            and (branches is None or target["branch"] in branches)
        ]

        if not selected:
            valid = ", ".join(f'{target["source"]}/{target["branch"]}' for target in targets)
            print(f"::error::No build target matched. Valid targets: {valid}")
            sys.exit(1)

        matrix = json.dumps({"include": selected}, separators=(",", ":"))
        names = ", ".join(f'{target["source"]}/{target["branch"]}' for target in selected)

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"matrix={matrix}\n")
            output.write(f"targets={names}\n")

        print(f"Selected targets: {names}")
        PY

  build:
    needs: prepare
    # Without this, the display name expands to every matrix value including
    # repo_url and all three script paths.
    name: build (${{ matrix.source }}/${{ matrix.branch }})
    runs-on: ubuntu-24.04
    # GitHub hard-kills a job at 6h without running the remaining steps; stop
    # earlier so the build-log upload below still gets a chance to run.
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.source }}-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Package Makefiles from cloned third-party repositories run during the
        # build; do not leave a repository write credential in git config.
        persist-credentials: false

    - name: Init environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # An x86_64 build with two Go packages is the workload most likely to
        # hit ENOSPC on a hosted runner, so reclaim everything not needed here.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
          /usr/local/lib/node_modules /opt/az /usr/share/swift
        sudo docker image prune --all --force

        # apt on hosted runners is a common flake; retry before failing the job.
        apt_retry() {
          for attempt in 1 2 3; do
            if sudo -E apt-get "$@"; then
              return 0
            fi
            echo "apt-get $* failed (attempt $attempt); retrying in 15s"
            sleep 15
          done
          return 1
        }
        apt_retry -qq update
        apt_retry -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm npm genisoimage ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo npm install -g pnpm
        apt_retry -qq autoremove --purge
        apt_retry -qq clean
        sudo timedatectl set-timezone "$TZ"
        df -hT /

    - name: Clone source code
      run: |
        df -hT "$PWD"
        git clone --depth 1 ${{ matrix.repo_url }} -b ${{ matrix.branch }} openwrt
        # Recorded so the update checker's "already built" marker is only
        # written after this exact upstream commit has published successfully.
        echo "SOURCE_SHA=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV

    # The dl/ cache was removed deliberately.  A repository only gets 10 GB of
    # Actions cache; dl (~2-3 GB) plus ccache (~2-5 GB) times two branches blows
    # that budget and evicts entries that matter more -- including the update
    # checker's commit markers, whose loss triggers pointless rebuilds.
    # Re-downloading sources costs minutes; a cold ccache costs hours.
    # Dropping dl/ also retires the go-mod-cache exclusion that kept poisoning
    # daed builds with bogus "missing internal package" errors.
    # Explicit restore/save instead of actions/cache: that action's post step is
    # post-if: success(), so a build that failed after two hours contributed
    # nothing and the retry started just as cold.
    #
    # The key is deliberately run-unique with a plain prefix for restore.  The
    # old key was a hash of the config and build scripts, which meant the
    # primary key always hit, actions/cache skipped the save entirely, and the
    # ccache stayed frozen at whatever the very first build produced while
    # upstream master moved on every 6 hours.  No content hash is needed here:
    # ccache is content-addressed internally, so a stale entry is simply unused
    # rather than wrong, and editing .config no longer throws away a warm cache.
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: openwrt/.ccache
        key: ${{ runner.os }}-ccache-${{ matrix.source }}-${{ matrix.branch }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.source }}-${{ matrix.branch }}-

    - name: Bound ccache size
      run: |
        mkdir -p openwrt/.ccache
        # Two branches share one 10 GB repository budget; keep each entry small
        # enough that a few generations coexist instead of evicting each other.
        printf 'max_size = 2.0G\ncompression = true\n' > openwrt/.ccache/ccache.conf

    - name: Load custom feeds
      run: |
        [ -e feeds.conf.default ] && mv feeds.conf.default openwrt/feeds.conf.default
        chmod +x ${{ matrix.diy_p1_sh }}
        cd openwrt
        $GITHUB_WORKSPACE/${{ matrix.diy_p1_sh }}

    - name: Update feeds
      run: |
        cd openwrt

        show_feed_dumps() {
          if find logs/feeds -name dump.txt -print -quit 2>/dev/null | grep -q .; then
            echo "Feed metadata dump logs:"
            find logs/feeds -name dump.txt -print | sort | while read -r dump; do
              echo "===== $dump ====="
              sed -n '1,160p' "$dump"
            done
          fi
        }

        if ./scripts/feeds update -a; then
          exit 0
        fi

        echo "Feed update failed; retrying after cleanup..."
        show_feed_dumps
        rm -rf feeds tmp/info logs/feeds
        sleep 10

        if ./scripts/feeds update -a; then
          exit 0
        fi

        show_feed_dumps
        exit 1

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e ${{ matrix.config_file }} ] && mv ${{ matrix.config_file }} openwrt/.config
        chmod +x ${{ matrix.diy_p2_sh }}
        cd openwrt
        $GITHUB_WORKSPACE/${{ matrix.diy_p2_sh }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        echo "Checking kenzok8/openwrt-daede package selection..."
        kenzok_dae_makefile="package/dae/dae/Makefile"
        kenzok_daed_makefile="package/dae/daed/Makefile"
        kenzok_luci_makefile="package/dae/luci-app-daede/Makefile"
        for makefile in "$kenzok_dae_makefile" "$kenzok_daed_makefile" "$kenzok_luci_makefile"; do
          if [ ! -s "$makefile" ]; then
            echo "::error::kenzok8 package Makefile is missing: $makefile"
            exit 1
          fi
        done
        for conflicting_entry in \
          package/feeds/packages/dae \
          package/feeds/packages/daed \
          package/feeds/luci/luci-app-daed \
          package/feeds/luci/luci-app-daede; do
          if [ -e "$conflicting_entry" ] || [ -L "$conflicting_entry" ]; then
            echo "::error::Official/conflicting daede package entry still exists: $conflicting_entry"
            exit 1
          fi
        done
        for symbol in \
          CONFIG_PACKAGE_dae \
          CONFIG_PACKAGE_daed \
          CONFIG_PACKAGE_luci-app-daede \
          CONFIG_PACKAGE_luci-app-daede_dae; do
          if ! grep -qx "${symbol}=y" .config; then
            echo "::error::${symbol} is not enabled after make defconfig."
            exit 1
          fi
        done
        if grep -Eq '^CONFIG_PACKAGE_(luci-app-daed|daed-(geoip|geosite))=y$' .config; then
          echo "::error::Old official daed/LuCI packages are still enabled."
          grep -E '^CONFIG_PACKAGE_(luci-app-daed|daed-(geoip|geosite))=y$' .config
          exit 1
        fi
        grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' "$kenzok_dae_makefile"
        grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' "$kenzok_daed_makefile"
        grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' "$kenzok_luci_makefile"
        patched_defaults="package/dae/luci-app-daede/root/etc/config/daede"
        patched_generator="package/dae/luci-app-daede/root/usr/share/luci-app-daede/gen-dae-config.sh"
        echo "Checking local dae + dual AdGuardHome profile patch..."
        grep -q "option active_backend 'dae'" "$patched_defaults" || {
          echo "::error::luci-app-daede does not default to the dae backend."
          exit 1
        }
        for expected in \
          "udp://127.0.0.1:50530" \
          "udp://127.0.0.1:50531" \
          "refusing to overwrite unmanaged" \
          "pname(AdGuardHome-dir, AdGuardHome-dire) -> must_direct" \
          "pname(AdGuardHome-pro, AdGuardHome-prox) ->"; do
          if ! grep -Fq "$expected" "$patched_generator"; then
            echo "::error::Patched dae generator is missing: $expected"
            exit 1
          fi
        done
        if grep -Fq 'echo "    ipversion_prefer: 4"' "$patched_generator"; then
          echo "::error::Patched dae generator still forces IPv4-only DNS responses."
          exit 1
        fi
        ppp_proto="package/network/services/ppp/files/ppp.sh"
        echo "Checking PPP syncdial probe patch..."
        if grep -Fq '[ "$(uci get syncdial.config.enabled)" -eq "1" ]' "$ppp_proto"; then
          echo "::error::PPP syncdial probe still fails when the optional UCI package is absent."
          exit 1
        fi
        grep -Fq '[ "$(uci -q get syncdial.config.enabled 2>/dev/null)" = "1" ]' "$ppp_proto" || {
          echo "::error::Expected safe PPP syncdial probe is missing."
          exit 1
        }
        custom_fstab="package/base-files/files/etc/config/fstab"
        grep -Eq "^[[:space:]]*option auto_mount '0'$" "$custom_fstab" || {
          echo "::error::Anonymous block auto-mount is enabled; /boot may be mounted twice."
          exit 1
        }
        fstab_migration="files/etc/uci-defaults/98-fstab-single-boot"
        if [ ! -x "$fstab_migration" ] || ! grep -Fq "auto_mount=0" "$fstab_migration"; then
          echo "::error::The old-fstab migration is missing or not executable."
          exit 1
        fi
        echo "Checking required F2FS overlay bootstrap packages in final .config..."
        for symbol in \
          CONFIG_PACKAGE_kmod-fs-f2fs \
          CONFIG_PACKAGE_mkf2fs \
          CONFIG_PACKAGE_f2fsck \
          CONFIG_PACKAGE_f2fs-tools \
          CONFIG_PACKAGE_openssh-sftp-server \
          CONFIG_PACKAGE_adguardhome; do
          if ! grep -qx "${symbol}=y" .config; then
            echo "::error::${symbol} is not enabled after make defconfig; squashfs images may lose configuration after reboot."
            exit 1
          fi
        done
        echo "Checking sysupgrade backup retention rules and backup helper..."
        keep_list="files/lib/upgrade/keep.d/my-immortalwrt"
        backup_helper="files/usr/sbin/my-sysupgrade-backup"
        if [ ! -s "$keep_list" ]; then
          echo "::error::${keep_list} is missing; plugin runtime configuration may be lost during sysupgrade."
          exit 1
        fi
        if [ ! -x "$backup_helper" ]; then
          echo "::error::${backup_helper} is missing or not executable."
          exit 1
        fi
        # Required minimum; keep.d may list more. The helper reads keep.d at
        # runtime, so this is the only place the required set is spelled out.
        for keep_path in \
          /etc/config/dae \
          /etc/config/daed \
          /etc/config/daede \
          /etc/dae \
          /etc/daed \
          /etc/AdGuardHome-direct.yaml \
          /etc/AdGuardHome-proxy.yaml \
          /etc/config/lucky \
          /etc/config/lucky.daji \
          /etc/config/watchdog \
          /etc/crontabs/root; do
          if ! grep -qx "$keep_path" "$keep_list"; then
            echo "::error::${keep_path} is missing from ${keep_list}; plugin runtime configuration may be lost during sysupgrade."
            exit 1
          fi
        done
        grep -Fq '/lib/upgrade/keep.d/my-immortalwrt' "$backup_helper" || {
          echo "::error::${backup_helper} no longer reads the retention list; the two would drift apart again."
          exit 1
        }
        sh -n "$backup_helper"
        sh -n files/etc/init.d/adh-direct files/etc/init.d/adh-proxy \
          files/etc/uci-defaults/98-fstab-single-boot files/etc/uci-defaults/99-adh-dual
        for spec in \
          "files/etc/AdGuardHome-direct.yaml|127.0.0.1:50080" \
          "files/etc/AdGuardHome-proxy.yaml|127.0.0.1:50081"; do
          conf="${spec%%|*}"
          address="${spec#*|}"
          grep -Fq "  address: $address" "$conf" || {
            echo "::error::Unauthenticated default Web UI is not loopback-only in $conf."
            exit 1
          }
        done
        if grep -Fq -- '--web-addr 192.168.50.1:' files/etc/init.d/adh-direct files/etc/init.d/adh-proxy files/etc/uci-defaults/99-adh-dual; then
          echo "::error::An init script still overrides the protected AdGuardHome Web address."
          exit 1
        fi
        for attempt in 1 2 3; do
          if make download -j"$(nproc)"; then
            break
          fi
          echo "make download failed (attempt ${attempt}/3); retrying in 15s"
          sleep 15
        done

        # Do not carry a downloaded Go module cache into package builds;
        # package compilation will recreate it from a clean state.
        rm -rf dl/go-mod-cache tmp/go-build

        # Drop truncated artefacts, then download again so they are actually
        # refetched here.  Previously they were deleted and never replaced, which
        # pushed the refetch into the compile stage as a serial download.
        find dl -type f -size -1024c -print -delete
        make download -j"$(nproc)"
        rm -rf dl/go-mod-cache tmp/go-build

        if find dl -type f -size -1024c -print -quit | grep -q .; then
          echo "::error::Truncated download files remain after refetch:"
          find dl -type f -size -1024c -print
          exit 1
        fi

    - name: Compile firmware
      id: compile
      # Leaves ~30 min of the job budget for uploading logs, artifacts and the
      # release.  A step timeout marks the step failed (unlike a job timeout,
      # which cancels and skips the remaining steps), so the build-log upload
      # below still runs.
      timeout-minutes: 320
      run: |
        cd openwrt
        clean_go_caches() {
          rm -rf dl/go-mod-cache tmp/go-build
          rm -rf build_dir/target-*/daed-* build_dir/target-*/AdGuardHome-* build_dir/target-*/adguardhome-*
        }

        echo "$(nproc) thread compile"
        echo "===================="
        echo "Build started at: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "Source: ${{ matrix.source }}"
        echo "Branch: ${{ matrix.branch }}"
        echo "===================="
        df -hT "$PWD"

        # Retry strategy, in order of cost.  Every attempt is incremental --
        # no `make clean` -- because a from-scratch single-thread rebuild cannot
        # finish inside a hosted runner's 6h limit and only ever burned the job.
        #   1. parallel build
        #   2. plain parallel retry: most failures here are ordering races
        #      between packages, and the retry only redoes what actually failed
        #   3. single-thread with V=s, purely to get a readable log for the one
        #      failing package; CONFIG_BUILD_LOG also captures logs/ regardless
        build_ok=0
        for attempt in 1 2; do
          clean_go_caches
          if make -j"$(nproc)"; then
            build_ok=1
            echo "✅ Parallel build successful (attempt ${attempt})"
            break
          fi
          echo "⚠️ Parallel build attempt ${attempt}/2 failed"
        done

        if [ "$build_ok" -ne 1 ]; then
          echo "⚠️ Falling back to an incremental single-thread build for a readable log"
          clean_go_caches
          make -j1 V=s
          echo "⚠️ Single-thread build successful (parallel attempts failed)"
        fi

        echo "===================="
        echo "Build completed at: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "===================="
        echo "status=success" >> $GITHUB_OUTPUT
        # Join on '-': a multi-line value would corrupt $GITHUB_ENV.
        device_name="$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | paste -sd '-' -)"
        [ -n "$device_name" ] && echo "DEVICE_NAME=_${device_name}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "SOURCE_NAME=${{ matrix.source }}" >> $GITHUB_ENV
        echo "BRANCH_NAME=${{ matrix.branch }}" >> $GITHUB_ENV

    # Save even when the compile failed: a partially warmed ccache still makes
    # the next attempt materially faster.
    - name: Save ccache
      uses: actions/cache/save@v4
      if: ${{ !cancelled() }}
      continue-on-error: true
      with:
        path: openwrt/.ccache
        key: ${{ runner.os }}-ccache-${{ matrix.source }}-${{ matrix.branch }}-${{ github.run_id }}

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: failure() && steps.compile.outcome == 'failure'
      with:
        name: build-logs_${{ matrix.source }}_${{ matrix.branch }}
        path: |
          openwrt/logs
          openwrt/.config
        retention-days: 14
        if-no-files-found: warn

    - name: Check space
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.SOURCE_NAME }}_${{ env.BRANCH_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*

        # Drop an artifact and keep sha256sums consistent with what is published.
        drop_artifact() {
          local file
          for file in "$@"; do
            [ -e "$file" ] || continue
            echo "Dropping artifact: ${file#./}"
            rm -f "$file"
            [ -f sha256sums ] && sed -i "\| \*$(basename "$file")\$|d" sha256sums
          done
        }

        drop_artifact ./*ext4*.img ./*ext4*.img.gz

        # CONFIG_TARGET_ROOTFS_TARGZ emits the same archive under two names
        # (<profile>-rootfs.tar.gz and <profile>-targz-rootfs.tar.gz), which
        # published ~81 MiB of identical bytes twice per build.  Only drop the
        # duplicate once the contents are proven equal, so an upstream change
        # that makes them differ is not silently discarded.
        primary="$(find . -maxdepth 1 -type f -name '*-rootfs.tar.gz' ! -name '*targz-rootfs.tar.gz' -print -quit)"
        duplicate="$(find . -maxdepth 1 -type f -name '*targz-rootfs.tar.gz' -print -quit)"
        if [ -n "$primary" ] && [ -n "$duplicate" ]; then
          if cmp -s "$primary" "$duplicate"; then
            drop_artifact "$duplicate"
          else
            echo "::warning::${duplicate#./} differs from ${primary#./}; publishing both."
          fi
        fi
        if ! find . -maxdepth 1 -type f -name '*squashfs-combined*.img.gz' -print -quit | grep -q .; then
          echo "No squashfs combined image was generated; refusing to publish incomplete firmware. Directory contents:"
          find . -maxdepth 1 -type f -printf '%f\n' | sort
          exit 1
        fi
        if ! find . -maxdepth 1 -type f \( -name '*.img.gz' -o -name '*kernel.bin' -o -name '*rootfs.tar.gz' \) -print -quit | grep -q .; then
          echo "No firmware images were generated; treating build as failed. Directory contents:"
          find . -maxdepth 1 -type f -printf '%f\n' | sort
          exit 1
        fi
        manifest="$(find . -maxdepth 1 -type f -name '*.manifest' -print -quit)"
        if [ -z "$manifest" ]; then
          echo "::error::No firmware package manifest found; cannot verify F2FS overlay bootstrap packages."
          exit 1
        fi
        echo "Checking required F2FS overlay bootstrap packages in $manifest..."
        for pkg in kmod-fs-f2fs mkf2fs f2fsck openssh-sftp-server adguardhome; do
          if ! grep -Eq "^${pkg}[[:space:]]" "$manifest"; then
            echo "::error::${pkg} is missing from firmware manifest; squashfs images may lose configuration after reboot."
            exit 1
          fi
        done
        echo "Checking kenzok8/openwrt-daede versions in firmware manifest..."
        kenzok_dae_version="$(sed -n 's/^PKG_VERSION:=//p' ../../../../package/dae/dae/Makefile | head -n 1)"
        kenzok_daed_version="$(sed -n 's/^PKG_VERSION:=//p' ../../../../package/dae/daed/Makefile | head -n 1)"
        kenzok_luci_version="$(sed -n 's/^PKG_VERSION:=//p' ../../../../package/dae/luci-app-daede/Makefile | head -n 1)"
        for spec in \
          "dae|$kenzok_dae_version" \
          "daed|$kenzok_daed_version" \
          "luci-app-daede|$kenzok_luci_version"; do
          pkg="${spec%%|*}"
          version="${spec#*|}"
          if [ -z "$version" ] || ! grep -E "^${pkg}[[:space:]]" "$manifest" | grep -Fq "$version"; then
            echo "::error::Firmware manifest does not contain kenzok8 ${pkg} ${version:-unknown}."
            grep -E "^${pkg}[[:space:]]" "$manifest" || true
            exit 1
          fi
        done
        if grep -Eq '^(luci-app-daed|daed-(geoip|geosite))[[:space:]]' "$manifest"; then
          echo "::error::Firmware manifest still contains old official daed/LuCI packages."
          grep -E '^(luci-app-daed|daed-(geoip|geosite))[[:space:]]' "$manifest"
          exit 1
        fi
        rm -rf packages
        cp -f ../../../../.config "${{ matrix.source }}-${{ matrix.branch }}.config" 2>/dev/null || true
        # Ship the resolved third-party package sources with the firmware so a
        # released image can be traced back to exact mirror/upstream commits.
        cp -f ../../../../package-provenance.txt "${{ matrix.source }}-${{ matrix.branch }}_packages.txt" 2>/dev/null || true
        kernel_config="$(find ../../../../build_dir -path '*/linux-*/linux-*/.config' -type f -print -quit 2>/dev/null || true)"
        [ -n "$kernel_config" ] && cp -f "$kernel_config" "${{ matrix.source }}-${{ matrix.branch }}_kernel.config" || true
        echo "Published firmware files:"
        find . -maxdepth 1 -type f -printf '%f\n' | sort
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.SOURCE_NAME }}_${{ env.BRANCH_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        # These same files are attached to the release below; the artifact is
        # only a short-lived convenience, so do not hold storage quota for 90d.
        retention-days: 7

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ matrix.source }}-${{ matrix.branch }}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "📦 **ImmortalWrt x86_64 固件**" >> release.txt
        echo "" >> release.txt
        echo "🔹 **镜像名**: \`${{ matrix.source }}\`" >> release.txt
        echo "🔹 **上游**: ImmortalWrt" >> release.txt
        echo "🔹 **分支**: \`${{ matrix.branch }}\`" >> release.txt
        echo "🔹 **Dae / Daed / LuCI 源**: \`kenzok8/openwrt-daede\`（经 \`hellomrli/my-openwrt-packages\` 镜像）" >> release.txt
        echo "🔹 **ADH 运行时**: \`adguardhome\`（双实例，不使用 luci-app-adguardhome）" >> release.txt
        echo "🔹 **Golang**: ImmortalWrt 官方 \`packages/lang/golang\`（Go 1.26.x）" >> release.txt
        echo "🔹 **构建日期**: $(date '+%Y-%m-%d %H:%M:%S')" >> release.txt
        echo "" >> release.txt
        echo "### 默认配置" >> release.txt
        echo "- IP: 192.168.50.1" >> release.txt
        echo "- 用户名: root" >> release.txt
        echo "- 密码: 无（首次登录需设置）" >> release.txt
        echo "" >> release.txt
        echo "### 已集成组件" >> release.txt
        echo "- dae + daed + luci-app-daede（双后端统一管理）" >> release.txt
        echo "- 官方 AdGuardHome + 双实例配置：adh-direct / adh-proxy" >> release.txt
        echo "- Lucky" >> release.txt
        echo "- Watchdog" >> release.txt
        echo "- SQM / UPnP" >> release.txt
        echo "- openssh-sftp-server" >> release.txt
        if [ -s openwrt/package-provenance.txt ]; then
          echo "" >> release.txt
          echo "### 第三方包来源" >> release.txt
          echo '```' >> release.txt
          cat openwrt/package-provenance.txt >> release.txt
          echo '```' >> release.txt
        fi
        echo "" >> release.txt
        echo "📖 [完整文档](https://github.com/hellomrli/my-ImmortalWrt/blob/main/README.md)" >> release.txt
        echo "" >> release.txt
        echo "### 下载建议" >> release.txt
        echo "- PVE / x86_64 软路由优先使用 \`squashfs-combined-efi.img.gz\`" >> release.txt
        echo "- Legacy BIOS 环境使用 \`squashfs-combined.img.gz\`" >> release.txt
        echo "- 升级前运行：\`my-sysupgrade-backup\`，并把生成的压缩包复制到电脑/NAS" >> release.txt
        echo "- 本仓库不再构建或发布 ext4 combined 镜像" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # The update checker used to cache this marker itself, right after
    # dispatching -- so a build that failed was still recorded as "done" and was
    # never retried until upstream happened to push again.  Write it here, only
    # once this exact upstream commit has actually produced a release.
    - name: Mark upstream commit as built
      id: mark
      if: steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      run: |
        mkdir -p .commitHash
        echo "${{ matrix.source }}/${{ matrix.branch }}=${SOURCE_SHA}" \
          > ".commitHash/${{ matrix.source }}-${{ matrix.branch }}"

    - name: Save built-commit marker
      uses: actions/cache/save@v4
      if: steps.mark.outcome == 'success' && !cancelled()
      continue-on-error: true
      with:
        path: .commitHash/${{ matrix.source }}-${{ matrix.branch }}
        key: commitHash_${{ matrix.source }}_${{ matrix.branch }}_${{ env.SOURCE_SHA }}

    - name: Refresh README build table
      if: steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run update-readme-build-table.yml --repo="${{ github.repository }}" --ref="${{ github.ref_name }}"

    - name: Remove old releases
      if: steps.tag.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release list --repo="${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' \
          | grep "^${{ matrix.source }}-${{ matrix.branch }}-" \
          | tail -n +6 > old-releases.txt || true
        while read -r tag; do
          [ -n "$tag" ] && gh release delete --repo="${{ github.repository }}" "$tag" --yes --cleanup-tag || true
        done < old-releases.txt

  cleanup-runs:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
    - name: Delete workflow runs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Keep 20, not 2.  Build logs are the only way to diagnose a cloud
        # build, and deleting them two runs later made failures unreviewable.
        gh run list --repo="${{ github.repository }}" --workflow="${{ github.workflow }}" --limit 100 --json databaseId,status --jq '.[] | select(.status != "in_progress") | .databaseId' > old-runs.txt
        tail -n +21 old-runs.txt | while read -r run_id; do
          [ -n "$run_id" ] && gh run delete --repo="${{ github.repository }}" "$run_id" || true
        done
